version: '3.8'

services:
  hust-agent-api:
    build: .
    container_name: hust_agent_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount thư mục workspace để dữ liệu sinh ra bởi các User không bị mất
      - ./workspace:/app/workspace
      
      # Mount thư mục chứa dữ liệu Vector RAG (tránh mất file pickle khi restart container)
      - ./rag_docstore:/app/rag_docstore
      
    restart: unless-stopped
